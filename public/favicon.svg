<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Chevron Gradient -->
    <linearGradient id="chevronGrad" x1="12" y1="16" x2="38" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Spark Star Gradient -->
    <linearGradient id="sparkGrad" x1="36" y1="14" x2="56" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <!-- Cursor Gradient -->
    <linearGradient id="cursorGrad" x1="16" y1="50" x2="44" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Radial Glow -->
    <radialGradient id="glow" cx="44" cy="26" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Ambient Glow -->
  <circle cx="44" cy="26" r="16" fill="url(#glow)" />

  <!-- Prompt Chevron Bracket ( > ) -->
  <path
    d="M16 17.5L31.5 31.5C32.3 32.2 32.3 33.4 31.5 34.1L16 48.1"
    stroke="url(#chevronGrad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- AI Generative Spark Star -->
  <path
    d="M44 14C44 21.5 48.5 26 56 26C48.5 26 44 30.5 44 38C44 30.5 39.5 26 32 26C39.5 26 44 21.5 44 14Z"
    fill="url(#sparkGrad)"
  />

  <!-- Star Radiant Center Point -->
  <circle cx="44" cy="26" r="2.5" fill="#ffffff" />

  <!-- Terminal Cursor Underline -->
  <rect x="22" y="48" width="22" height="3.5" rx="1.75" fill="url(#cursorGrad)" />
</svg>
